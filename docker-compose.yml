services:
  db:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - db

  etl:
    build:
      context: .
      dockerfile: Dockerfile.etl
    env_file: .env
    depends_on:
      - db
